[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "paper-radar"
version = "0.2.0"
description = "Multi-source paper radar with AI ranking and Feishu delivery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "Pillow>=11,<13",
  "httpx>=0.27,<1",
  "openai>=2.0,<3",
  "PyYAML>=6.0,<7",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
paper-radar = "paper_radar.app:main"

[tool.hatch.build.targets.wheel]
packages = ["paper_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
