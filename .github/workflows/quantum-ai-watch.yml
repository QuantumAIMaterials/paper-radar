name: Quantum AI Materials Radar

on:
  schedule:
    # Stagger triggers and the final start to avoid source API contention.
    - cron: "53 0 * * *" # 08:53 Beijing; hedge against very long cron delays
    - cron: "53 4 * * *" # 12:53 Beijing; primary delayed-trigger hedge
    - cron: "38 5 * * *" # 13:38 Beijing; on-time fallback within the wait limit
    - cron: "23 8 * * *" # 16:23 Beijing; final fallback
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview results without sending or updating state"
        required: true
        type: boolean
        default: true
      no_ai:
        description: "Skip optional Responses API evaluation"
        required: true
        type: boolean
        default: false
      resend_latest:
        description: "Resend the latest digest, ignoring deduplication"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-radar-quantum-ai-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'state' }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.QUANTUM_AI_FEISHU_WEBHOOK_URL }}
      FEISHU_SIGNING_SECRET: ${{ secrets.QUANTUM_AI_FEISHU_SIGNING_SECRET }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-5.6-sol' }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'low' }}
      ARXIV_CONTACT: ${{ vars.ARXIV_CONTACT }}
    steps:
      # Scheduled/queued runs must start from the latest state commit, not the
      # event SHA captured before another radar run updates the branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.ref_name || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Run Quantum AI Materials radar
        id: radar
        continue-on-error: true
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_NO_AI: ${{ inputs.no_ai }}
          MANUAL_RESEND_LATEST: ${{ inputs.resend_latest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(
            --config config/quantum_ai_keywords.yml
            --prompt config/quantum_ai_recommender_prompt.txt
            --state state/quantum_ai_seen.json
          )
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_NO_AI" == "true" ]]; then
            args+=(--no-ai)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_RESEND_LATEST" == "true" ]]; then
            args+=(--resend-latest)
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            args+=(
              --start-not-before 18:40
              --max-start-wait-minutes 330
              --deliver-not-before 19:08
              --once-per-beijing-day
            )
          fi
          python -m paper_radar "${args[@]}"
      - name: Commit Quantum AI deduplication state
        if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.resend_latest))
        run: |
          if git diff --quiet -- state/quantum_ai_seen.json; then
            exit 0
          fi
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar[bot]@users.noreply.github.com"
          git add state/quantum_ai_seen.json
          git commit -m "chore: update Quantum AI radar state"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Propagate radar failure
        if: steps.radar.outcome == 'failure'
        run: exit 1
