name: 2D Quantum Materials Radar

on:
  schedule:
    # GitHub cron is best-effort, so use independent off-peak attempts. The
    # application prepares before 19:00 and records one successful run per day.
    - cron: "47 0 * * *" # 08:47 Beijing; hedge against very long cron delays
    - cron: "47 4 * * *" # 12:47 Beijing; primary delayed-trigger hedge
    - cron: "32 5 * * *" # 13:32 Beijing; on-time fallback within the wait limit
    - cron: "17 8 * * *" # 16:17 Beijing; final fallback
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview results without sending or updating state"
        required: true
        type: boolean
        default: true
      no_ai:
        description: "Skip optional Responses API evaluation"
        required: true
        type: boolean
        default: false
      resend_latest:
        description: "Resend the latest digest, ignoring deduplication"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-radar-2d-${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.run_id || 'state' }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-5.6-sol' }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'low' }}
      ARXIV_CONTACT: ${{ vars.ARXIV_CONTACT }}
    steps:
      # Scheduled/queued runs must start from the latest state commit, not the
      # event SHA captured before another radar run updates the branch.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && github.ref_name || 'main' }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Run radar
        id: radar
        continue-on-error: true
        env:
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
          MANUAL_NO_AI: ${{ inputs.no_ai }}
          MANUAL_RESEND_LATEST: ${{ inputs.resend_latest }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_NO_AI" == "true" ]]; then
            args+=(--no-ai)
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_RESEND_LATEST" == "true" ]]; then
            args+=(--resend-latest)
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            args+=(
              --start-not-before 18:30
              --max-start-wait-minutes 330
              --deliver-not-before 19:00
              --once-per-beijing-day
            )
          fi
          python -m paper_radar "${args[@]}"
      - name: Commit deduplication state
        if: always() && !(github.event_name == 'workflow_dispatch' && (inputs.dry_run || inputs.resend_latest))
        run: |
          if git diff --quiet -- state/seen.json; then
            exit 0
          fi
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "chore: update paper radar state"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Propagate radar failure
        if: steps.radar.outcome == 'failure'
        run: exit 1
